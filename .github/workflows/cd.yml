name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull ankushmahant18/ak-image:v1

            # Purana container stop hoga; brief downtime hogi
            if docker container inspect d1bbf34bea2f >/dev/null 2>&1; then
              docker stop d1bbf34bea2f
            fi

            if docker container inspect ak-app >/dev/null 2>&1; then
              docker rm -f ak-app
            fi

            docker run -d \
              --name ak-app \
              --restart unless-stopped \
              -e PORT=3000 \
              -p 3000:3000 \
              ankushmahant18/ak-image:v1